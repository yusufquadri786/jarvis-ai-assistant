<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>Yusuf AI Assistant</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0b0d;--panel:#121216;--line:#28282f;--text:#f5f5f7;--muted:#a1a1aa;--accent:#ff8a24;--accent2:#ffb15c}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 50% -20%,#302015 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
    button,textarea,select{font:inherit}
    .shell{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:22px 18px}
    header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:6px 0 18px}
    .orb{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe2bf,#ff8a24 42%,#8b3500 76%);box-shadow:0 0 26px #ff8a2445;position:relative;flex:none}
    .orb:after{content:"";position:absolute;inset:-5px;border:1px solid #ff8a2444;border-radius:50%;animation:pulse 2.4s infinite}
    @keyframes pulse{0%{transform:scale(.92);opacity:.75}100%{transform:scale(1.3);opacity:0}}
    h1{font-size:17px;margin:0;letter-spacing:.2px} .sub{font-size:12px;color:var(--muted);margin-top:2px}
    .status{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
    .dot{width:7px;height:7px;background:#777;border-radius:50%}.dot.ready{background:#55d68b}
    main{flex:1;display:flex;flex-direction:column;min-height:420px}
    .welcome{text-align:center;margin:auto auto 20px;padding:45px 10px 18px}
    .welcome .orb{margin:0 auto 20px;width:56px;height:56px}
    .welcome h2{font-size:clamp(27px,5vw,39px);line-height:1.18;margin:0 0 12px;letter-spacing:-1px}
    .welcome h2 span{color:var(--accent2)}
    .welcome p{max-width:510px;color:var(--muted);margin:0 auto 24px}
    .suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
    .suggestion{border:1px solid var(--line);background:#151519;color:#ddd;border-radius:13px;padding:10px 13px;cursor:pointer}
    .suggestion:hover{border-color:#b95d1c;background:#201710}
    #messages{display:flex;flex-direction:column;gap:16px;padding:24px 0 18px}
    .message{max-width:85%;padding:13px 16px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}
    .user{align-self:flex-end;background:#302015;border:1px solid #54341e}
    .assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
    .error{color:#ffb0a7}
    .composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 20%);padding:16px 0 4px}
    .inputbox{border:1px solid #383840;background:#141418;border-radius:20px;padding:10px;box-shadow:0 8px 35px #0006}
    textarea{display:block;width:100%;resize:vertical;min-height:56px;max-height:180px;background:transparent;border:0;outline:0;color:var(--text);padding:8px 9px}
    .controls{display:flex;align-items:center;gap:9px;padding:3px 3px 2px}
    select{background:#1c1c22;color:#ddd;border:1px solid var(--line);border-radius:10px;padding:8px;max-width:155px}
    .hint{font-size:11px;color:#777;margin:10px 4px 0;text-align:center}
    .send{margin-left:auto;border:0;border-radius:12px;background:var(--accent);color:#1a1007;font-weight:700;padding:10px 16px;cursor:pointer}
    .send:disabled{opacity:.5;cursor:wait}
    footer{color:#777;font-size:11px;text-align:center;padding:16px 0 0}
    @media(max-width:520px){.shell{padding:14px 12px}.message{max-width:94%}.welcome{padding-top:28px}.suggestion{font-size:13px}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="orb" aria-hidden="true"></div>
    <div><h1>Yusuf AI Assistant</h1><div class="sub">Your ideas. One conversation.</div></div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking…</span></div>
  </header>
  <main>
    <section class="welcome" id="welcome">
      <div class="orb" aria-hidden="true"></div>
      <h2>What are we <span>building</span> today?</h2>
      <p>A multilingual assistant for learning, coding, brainstorming, and everyday questions. Ask in English or Hindi.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain Python variables in simple Hindi.">Learn Python</button>
        <button class="suggestion" data-prompt="Help me make a step-by-step plan for my project.">Plan a project</button>
        <button class="suggestion" data-prompt="Explain a difficult science topic with examples suitable for Class 8.">Study science</button>
      </div>
    </section>
    <section id="messages" aria-live="polite" aria-label="Conversation"></section>
  </main>
  <section class="composer">
    <div class="inputbox">
      <textarea id="prompt" maxlength="8000" rows="2" aria-label="Message" placeholder="Message Yusuf AI Assistant…"></textarea>
      <div class="controls">
        <select id="language" aria-label="Reply language">
          <option value="auto">Auto language</option>
          <option value="English">English</option>
          <option value="Hindi">हिन्दी (Hindi)</option>
          <option value="Hinglish">Hinglish</option>
        </select>
        <button id="send" class="send">Send ↗</button>
      </div>
    </div>
    <div class="hint">AI can make mistakes. Check important information.</div>
  </section>
  <footer>Yusuf AI Assistant · Local development preview</footer>
</div>
<script>
  const promptBox = document.getElementById('prompt');
  const sendButton = document.getElementById('send');
  const messages = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  const language = document.getElementById('language');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  function addMessage(text, who, isError=false) {
    const node = document.createElement('div');
    node.className = 'message ' + who + (isError ? ' error' : '');
    node.textContent = text;
    messages.appendChild(node);
    node.scrollIntoView({behavior:'smooth', block:'end'});
    return node;
  }

  async function refreshStatus() {
    try {
      const response = await fetch('/api/status');
      const data = await response.json();
      if (data.api_key_configured) {
        statusDot.classList.add('ready');
        statusText.textContent = 'Ready';
      } else {
        statusText.textContent = 'Setup needed';
      }
    } catch (_) {
      statusText.textContent = 'Offline';
    }
  }

  async function sendMessage(text) {
    const message = (text ?? promptBox.value).trim();
    if (!message || sendButton.disabled) return;
    welcome.hidden = true;
    promptBox.value = '';
    addMessage(message, 'user');
    sendButton.disabled = true;
    sendButton.textContent = 'Thinking…';
    const pending = addMessage('Thinking…', 'assistant');
    try {
      const response = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message, language:language.value})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || 'The request could not be completed.');
      pending.textContent = data.reply;
    } catch (error) {
      pending.textContent = error.message || 'Could not connect to the assistant.';
      pending.classList.add('error');
    } finally {
      sendButton.disabled = false;
      sendButton.textContent = 'Send ↗';
      promptBox.focus();
    }
  }

  sendButton.addEventListener('click', () => sendMessage());
  promptBox.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
  document.querySelectorAll('[data-prompt]').forEach(button => {
    button.addEventListener('click', () => {
      promptBox.value = button.dataset.prompt;
      promptBox.focus();
    });
  });
  refreshStatus();
</script>
</body>
</html>
