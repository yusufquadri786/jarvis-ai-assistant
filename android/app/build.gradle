plugins {
    id 'com.android.application'
}

def configuredBackend = providers.gradleProperty("BACKEND_URL").orElse("").get()
def escapedBackend = configuredBackend.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace 'com.nexora.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexora.ai'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.1'
        buildConfigField 'String', 'BACKEND_URL', '"' + escapedBackend + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
